<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 160" width="120" height="160" fill="none">
  <defs>
    <filter id="bouquetShadow" x="-20%" y="-10%" width="140%" height="130%">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-color="#3a2512" flood-opacity="0.35" />
    </filter>
  </defs>
  <g filter="url(#bouquetShadow)">
    <!-- Kraft wrapping cone -->
    <path
      d="M38 75 L82 75 L68 145 C64 152 56 152 52 145 Z"
      fill="#b89369"
      stroke="#977248"
      stroke-width="1.5"
    />
    <!-- Paper folds -->
    <path d="M42 75 L56 130 L64 130 L78 75 Z" fill="#c9a77e" opacity="0.6" />
    <!-- Twine tie / ribbon -->
    <ellipse cx="60" cy="115" rx="10" ry="3" fill="#6d4e28" stroke="#4a3215" stroke-width="1" />
    <!-- Twine bow ends -->
    <path d="M57 116 Q 48 126, 46 136 M 63 116 Q 72 126, 75 135" stroke="#4a3215" stroke-width="2" stroke-linecap="round" fill="none" />

    <!-- Green leaves -->
    <ellipse cx="38" cy="55" rx="12" ry="7" fill="#4d6e35" transform="rotate(-30 38 55)" />
    <ellipse cx="82" cy="55" rx="12" ry="7" fill="#587c3e" transform="rotate(30 82 55)" />
    <ellipse cx="60" cy="45" rx="10" ry="6" fill="#3b5627" />

    <!-- Sunflower 1 (Left) -->
    <g transform="translate(34, 46)">
      <!-- Yellow petals -->
      <circle cx="0" cy="0" r="16" fill="#f8c31e" stroke="#d49a0a" stroke-width="0.8" />
      <path d="M-18 0 Q 0 -18, 18 0 Q 0 18, -18 0 Z" fill="#ebb110" />
      <path d="M0 -18 Q 18 0, 0 18 Q -18 0, 0 -18 Z" fill="#f8c31e" />
      <path d="M-13 -13 Q 13 -13, 13 13 Q -13 13, -13 -13 Z" fill="#ebb110" />
      <!-- Brown center -->
      <circle cx="0" cy="0" r="8" fill="#4a2e16" stroke="#2f1a09" stroke-width="1" />
      <circle cx="0" cy="0" r="5" fill="#36200e" />
    </g>

    <!-- Sunflower 2 (Right) -->
    <g transform="translate(76, 44)">
      <!-- Yellow petals -->
      <circle cx="0" cy="0" r="17" fill="#f8c31e" stroke="#d49a0a" stroke-width="0.8" />
      <path d="M-19 0 Q 0 -19, 19 0 Q 0 19, -19 0 Z" fill="#ebb110" />
      <path d="M0 -19 Q 19 0, 0 19 Q -19 0, 0 -19 Z" fill="#f8c31e" />
      <path d="M-14 -14 Q 14 -14, 14 14 Q -14 14, -14 -14 Z" fill="#ebb110" />
      <!-- Brown center -->
      <circle cx="0" cy="0" r="8.5" fill="#4a2e16" stroke="#2f1a09" stroke-width="1" />
      <circle cx="0" cy="0" r="5.5" fill="#36200e" />
    </g>

    <!-- Sunflower 3 (Center Top) -->
    <g transform="translate(56, 26)">
      <circle cx="0" cy="0" r="18" fill="#fac92e" stroke="#d49a0a" stroke-width="0.8" />
      <path d="M-20 0 Q 0 -20, 20 0 Q 0 20, -20 0 Z" fill="#f0b615" />
      <path d="M0 -20 Q 20 0, 0 20 Q -20 0, 0 -20 Z" fill="#fac92e" />
      <!-- Brown center -->
      <circle cx="0" cy="0" r="9" fill="#503117" stroke="#331c0a" stroke-width="1" />
      <circle cx="0" cy="0" r="6" fill="#38210e" />
    </g>
  </g>
</svg>
